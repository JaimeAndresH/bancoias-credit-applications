services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: bancoias-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: bancoias
      RABBITMQ_DEFAULT_PASS: bancoias123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - bancoias_rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16
    container_name: bancoias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bancoias_credit
      POSTGRES_USER: bancoias
      POSTGRES_PASSWORD: bancoias123
    ports:
      - "5432:5432"
    volumes:
      - bancoias_postgres_data:/var/lib/postgresql/data

volumes:
  bancoias_rabbitmq_data:
  bancoias_postgres_data:
